name: CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'm3u8-queue-downloader/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'm3u8-queue-downloader/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    name: GUI checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: m3u8-queue-downloader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Check Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Fetch ffmpeg from upstream release
        shell: pwsh
        working-directory: .
        run: |
          gh release download 3.0.2 --repo nilaoda/N_m3u8DL-CLI `
            --pattern 'N_m3u8DL-CLI_v3.0.2_with_ffmpeg_and_SimpleG.zip' `
            --output upstream-bundle.zip
          Expand-Archive upstream-bundle.zip -DestinationPath upstream-bundle -Force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage bundled runtime resources
        shell: pwsh
        working-directory: .
        run: |
          $ffmpeg = (Resolve-Path 'upstream-bundle/ffmpeg.exe').Path
          Push-Location m3u8-queue-downloader
          npm run resources:stage -- --ffmpeg $ffmpeg
          npm run resources:validate
          Pop-Location

      - name: Tauri debug smoke build
        run: npm run tauri:smoke
